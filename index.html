<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRESS ARCHIVE COLLECTION</title>

<style>
:root{
  --bg:#050914;
  --text:#f4f1e9;
  --sub:#929aaa;
  --line:rgba(255,255,255,.17);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 5%,rgba(76,97,150,.16),transparent 27%),
    radial-gradient(circle at 88% 18%,rgba(68,78,135,.11),transparent 23%),
    var(--bg);
  font-family:"Helvetica Neue",Arial,sans-serif;
}

button,select{font:inherit}

.wrapper{
  width:min(1180px,calc(100% - 34px));
  margin:auto;
}

/* ===== STARS ===== */

.stars{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  opacity:.35;
}

.star.big{
  width:4px;
  height:4px;
  opacity:.7;
  box-shadow:0 0 12px rgba(190,210,255,.6);
}

/* ===== HEADER ===== */

header{
  padding:70px 0 44px;
  border-bottom:1px solid var(--line);
}

.kicker{
  margin-bottom:12px;
  color:#8992a5;
  font-size:9px;
  letter-spacing:.4em;
}

h1{
  margin:0;
  font-family:"Times New Roman",Georgia,serif;
  font-size:clamp(58px,11vw,140px);
  line-height:.77;
  letter-spacing:-.055em;
  font-weight:400;
}

.collection{
  margin-top:20px;
  font-size:10px;
  letter-spacing:.58em;
}

/* ===== CONTROLS ===== */

.controls{
  padding:30px 0 20px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}

.filter{
  border:0;
  border-bottom:1px solid transparent;
  background:none;
  color:#a4abba;
  padding:5px 2px;
  font-size:10px;
  letter-spacing:.12em;
  cursor:pointer;
}

.filter.active{
  color:#fff;
  border-color:#fff;
}

.sep{
  color:#626c80;
  font-size:9px;
}

.control-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-top:24px;
}

.favorite-filter{
  min-width:190px;
  padding:12px 22px;
  border:1px solid rgba(255,255,255,.48);
  background:transparent;
  color:#fff;
  font-size:10px;
  letter-spacing:.17em;
  cursor:pointer;
}

.favorite-filter.active{
  background:#fff;
  color:#050914;
}

.sort{
  display:flex;
  align-items:center;
  gap:10px;
}

.sort span{
  color:#6f788b;
  font-size:8px;
  letter-spacing:.2em;
}

select{
  border:0;
  border-bottom:1px solid rgba(255,255,255,.4);
  border-radius:0;
  outline:0;
  padding:7px 3px;
  color:#fff;
  background:transparent;
  font-size:9px;
  letter-spacing:.14em;
}

select option{
  background:#050914;
}

.meta{
  margin:18px 0;
  color:#6e7789;
  font-size:8px;
  letter-spacing:.2em;
}

/* ===== GRID ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:32px;
  row-gap:58px;
  padding-bottom:100px;
}

.article{
  min-width:0;
}

.thumb-link{
  display:block;
  color:inherit;
  text-decoration:none;
}

.thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(circle at 25% 20%,rgba(83,101,151,.24),transparent 30%),
    linear-gradient(135deg,#0c1427,#050914 60%,#10182b);
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .5s ease;
}

.article.magazine .thumb img{
  object-fit:contain;
  padding:12px;
}

.thumb-link:hover img{
  transform:scale(1.025);
}

.fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  text-align:center;
  padding:20px;
}

.fallback-star{
  font-family:Georgia,serif;
  font-size:25px;
}

.fallback-media{
  font-family:"Times New Roman",Georgia,serif;
  font-size:clamp(20px,4vw,30px);
}

.external{
  position:absolute;
  right:11px;
  bottom:10px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(5,9,20,.62);
  font-size:12px;
}

.info{
  padding-top:14px;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.date-type{
  display:flex;
  align-items:center;
  gap:11px;
}

.date{
  color:#9099aa;
  font-size:8px;
  letter-spacing:.16em;
}

.type{
  padding:4px 7px;
  border:1px solid rgba(255,255,255,.18);
  color:#9ba3b4;
  font-size:7px;
  letter-spacing:.16em;
}

.heart{
  border:0;
  background:none;
  color:#fff;
  padding:2px 4px;
  font-size:19px;
  cursor:pointer;
}

.media{
  margin-top:13px;
  font-family:"Times New Roman",Georgia,serif;
  font-size:24px;
}

.title{
  margin-top:7px;
  color:#c5c9d1;
  font-size:12px;
  line-height:1.7;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.tag{
  color:#9099aa;
  font-size:8px;
  letter-spacing:.15em;
}

.tag + .tag::before{
  content:"☆";
  margin-right:8px;
  color:#5e687b;
}

.empty{
  display:none;
  padding:80px 0 120px;
  text-align:center;
  color:#798294;
  font-family:Georgia,serif;
  letter-spacing:.15em;
}

footer{
  display:flex;
  justify-content:space-between;
  padding:32px 0 45px;
  border-top:1px solid var(--line);
  color:#626c80;
  font-size:8px;
  letter-spacing:.2em;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

  .wrapper{
    width:calc(100% - 28px);
  }

  header{
    padding:53px 0 34px;
  }

  h1{
    font-size:18vw;
  }

  .collection{
    font-size:8px;
  }

  .filter{
    font-size:9px;
  }

  .control-row{
    flex-direction:column;
    align-items:stretch;
  }

  .favorite-filter{
    width:100%;
  }

  .sort{
    justify-content:flex-end;
  }

  .grid{
    grid-template-columns:1fr;
    row-gap:48px;
  }

  footer{
    flex-direction:column;
    gap:9px;
  }
}
</style>
</head>

/* ===== STATE ===== */

const STORAGE_KEY="pressArchiveFavorites";

let favorites;

try{
  favorites=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
}catch{
  favorites=[];
}

let activeFilter="ALL";
let favoritesOnly=false;


/* ===== HELPERS ===== */

function formatDate(date){
  return date.replaceAll("-",".");
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ===== FAVORITES ===== */

function toggleFavorite(id){

  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(favorites)
  );

  render();
}


/* ===== CARD ===== */

function createCard(a){

  const article=document.createElement("article");

  article.className=
    "article "+(a.type==="MAGAZINE"?"magazine":"web");

  const tags=a.tags.map(tag=>
    `<span class="tag">${escapeHTML(tag)}</span>`
  ).join("");

  article.innerHTML=`

    <a
      class="thumb-link"
      href="${escapeHTML(a.url)}"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="thumb">

        ${
          a.image
          ?
          `<img
             src="${escapeHTML(a.image)}"
             alt="${escapeHTML(a.media)}"
             loading="lazy"
           >`
          :
          `<div class="fallback">
             <div class="fallback-star">✦</div>
             <div class="fallback-media">
               ${escapeHTML(a.media)}
             </div>
           </div>`
        }

        <span class="external">↗</span>

      </div>

    </a>

    <div class="info">

      <div class="topline">

        <div class="date-type">

          <span class="date">
            ${formatDate(a.date)}
          </span>

          <span class="type">
            ${escapeHTML(a.type)}
          </span>

        </div>

        <button
          class="heart"
          aria-label="お気に入り"
          data-heart="${escapeHTML(a.id)}"
        >
          ${favorites.includes(a.id)?"♥":"♡"}
        </button>

      </div>

      <div class="media">
        ${escapeHTML(a.media)}
      </div>

      <div class="title">
        ${escapeHTML(a.title)}
      </div>

      <div class="tags">
        ${tags}
      </div>

    </div>
  `;

  article
    .querySelector(".heart")
    .addEventListener("click",()=>{
      toggleFavorite(a.id);
    });

  const img=article.querySelector("img");

  if(img){

    img.addEventListener("error",()=>{

      const thumb=img.parentElement;

      img.remove();

      const fallback=document.createElement("div");

      fallback.className="fallback";

      fallback.innerHTML=`
        <div class="fallback-star">✦</div>
        <div class="fallback-media">
          ${escapeHTML(a.media)}
        </div>
      `;

      thumb.prepend(fallback);

    });

  }

  return article;
}


/* ===== RENDER ===== */

function render(){

  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  const meta=document.getElementById("meta");

  let list=[...articles];

  if(activeFilter!=="ALL"){
    list=list.filter(a=>a.tags.includes(activeFilter));
  }

  if(favoritesOnly){
    list=list.filter(a=>favorites.includes(a.id));
  }

  const direction=
    document.getElementById("sortSelect").value;

  list.sort((a,b)=>{

    const aa=new Date(a.date+"T00:00:00");
    const bb=new Date(b.date+"T00:00:00");

    return direction==="newest"
      ? bb-aa
      : aa-bb;

  });

  grid.innerHTML="";

  list.forEach(a=>{
    grid.appendChild(createCard(a));
  });

  meta.textContent=
    String(list.length).padStart(2,"0")
    +" ARCHIVES";

  empty.style.display=
    list.length ? "none":"block";
}


/* ===== MEMBER FILTER ===== */

document
.querySelectorAll(".filter")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".filter")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    activeFilter=btn.dataset.filter;

    favoritesOnly=false;

    document
      .getElementById("favoriteFilter")
      .classList.remove("active");

    render();

  });

});


/* ===== FAVORITES FILTER ===== */

document
.getElementById("favoriteFilter")
.addEventListener("click",function(){

  favoritesOnly=!favoritesOnly;

  this.classList.toggle(
    "active",
    favoritesOnly
  );

  render();

});


/* ===== SORT ===== */

document
.getElementById("sortSelect")
.addEventListener("change",render);


/* ===== STARS ===== */

const stars=document.getElementById("stars");

for(let i=0;i<80;i++){

  const s=document.createElement("span");

  s.className=
    Math.random()>.9
      ?"star big"
      :"star";

  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";

  stars.appendChild(s);
}


/* ===== START ===== */

render();

</script>
