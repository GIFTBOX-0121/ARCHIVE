<!DOCTYPE html>
<html lang="ja">

<title>PRESS ARCHIVE COLLECTION</title>

<style>

:root{
  --bg:#050914;
  --text:#f4f1e9;
  --sub:#929aaa;
  --line:rgba(255,255,255,.17);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);

  background:
    radial-gradient(circle at 15% 5%,rgba(76,97,150,.16),transparent 27%),
    radial-gradient(circle at 88% 18%,rgba(68,78,135,.11),transparent 23%),
    var(--bg);

  font-family:"Helvetica Neue",Arial,sans-serif;
}

button,
select{
  font:inherit;
}

.wrapper{
  width:min(1180px,calc(100% - 34px));
  margin:auto;
}


/* ======================================================
   STARS
====================================================== */

.stars{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:.35;
}

.star.big{
  width:4px;
  height:4px;
  opacity:.75;

  box-shadow:
    0 0 10px rgba(255,255,255,.45),
    0 0 22px rgba(150,180,255,.25);
}


/* ======================================================
   HEADER
====================================================== */

header{
  padding:70px 0 44px;
  border-bottom:1px solid var(--line);
}

.kicker{
  margin-bottom:12px;
  color:#8992a5;
  font-size:9px;
  letter-spacing:.4em;
}

h1{
  margin:0;

  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:clamp(58px,11vw,140px);
  line-height:.77;
  letter-spacing:-.055em;
  font-weight:400;
}

.collection{
  margin-top:20px;
  font-size:10px;
  letter-spacing:.58em;
}


/* ======================================================
   CONTROLS
====================================================== */

.controls{
  padding:30px 0 20px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}

.filter{
  border:0;
  border-bottom:1px solid transparent;
  background:none;
  color:#a4abba;

  padding:5px 2px;

  font-size:10px;
  letter-spacing:.12em;

  cursor:pointer;
}

.filter.active{
  color:white;
  border-color:white;
}

.sep{
  color:#626c80;
  font-size:9px;
}

.control-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;

  margin-top:24px;
}

.favorite-filter{
  min-width:190px;

  padding:12px 22px;

  border:1px solid rgba(255,255,255,.48);

  background:transparent;
  color:white;

  font-size:10px;
  letter-spacing:.17em;

  cursor:pointer;
}

.favorite-filter.active{
  background:white;
  color:#050914;
}

.sort{
  display:flex;
  align-items:center;
  gap:10px;
}

.sort span{
  color:#6f788b;
  font-size:8px;
  letter-spacing:.2em;
}

select{
  border:0;
  border-bottom:1px solid rgba(255,255,255,.4);
  border-radius:0;

  outline:0;

  padding:7px 3px;

  color:white;
  background:transparent;

  font-size:9px;
  letter-spacing:.14em;
}

select option{
  background:#050914;
}

.meta{
  margin:18px 0;

  color:#6e7789;

  font-size:8px;
  letter-spacing:.2em;
}


/* ======================================================
   GRID
====================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  column-gap:32px;
  row-gap:58px;

  padding-bottom:100px;
}

.article{
  min-width:0;
}


/* ======================================================
   THUMB
====================================================== */

.thumb-link{
  display:block;
  color:inherit;
  text-decoration:none;
}

.thumb{
  position:relative;

  width:100%;
  aspect-ratio:16/9;

  overflow:hidden;

  border:
    1px solid rgba(255,255,255,.08);

  background:
    radial-gradient(
      circle at 25% 20%,
      rgba(83,101,151,.24),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #0c1427,
      #050914 60%,
      #10182b
    );
}

.thumb img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:
    transform .5s ease,
    opacity .3s ease;
}

.article.magazine .thumb img{
  object-fit:contain;
  padding:12px;
}

.thumb-link:hover img{
  transform:scale(1.025);
}


/* ======================================================
   LOADING
====================================================== */

.loading{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:12px;

  color:#7e8798;

  font-family:Georgia,serif;

  letter-spacing:.15em;
}

.loading-star{
  font-size:24px;

  animation:
    pulse 1.6s ease-in-out infinite;
}

.loading-text{
  font-size:8px;
}

@keyframes pulse{

  0%,100%{
    opacity:.25;
  }

  50%{
    opacity:1;
  }

}


/* ======================================================
   FALLBACK
====================================================== */

.fallback{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:12px;

  text-align:center;

  padding:20px;
}

.fallback-star{
  font-family:Georgia,serif;
  font-size:25px;
}

.fallback-media{
  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:
    clamp(20px,4vw,30px);
}

.external{
  position:absolute;

  right:11px;
  bottom:10px;

  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border:
    1px solid rgba(255,255,255,.4);

  background:
    rgba(5,9,20,.62);

  backdrop-filter:
    blur(7px);

  font-size:12px;
}


/* ======================================================
   INFO
====================================================== */

.info{
  padding-top:14px;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;

.date-type{
  display:flex;
  align-items:center;
  gap:11px;

  letter-spacing:.16em;

.type{

.heart{

.media{

.title{

.tags{

  font-size:8px;
  letter-spacing:.15em;

/* ======================================================
   EMPTY
====================================================== */

.empty{
  display:none;

  padding:80px 0 120px;

  text-align:center;

  color:#798294;

  font-family:Georgia,serif;
  letter-spacing:.15em;

/* ======================================================
   FOOTER
====================================================== */

footer{
  display:flex;
  justify-content:space-between;

  padding:32px 0 45px;

  border-top:1px solid var(--line);

  color:#626c80;

  font-size:8px;

/* ======================================================

====================================================== */

  }

  }

  .grid{
    grid-template-columns:1fr;
    row-gap:48px;
  }

  footer{
    flex-direction:column;
    gap:9px;
  }

}

/* =========================================================
   ID 自動生成
========================================================= */

articles.forEach((article,index)=>{

  if(!article.id){

    article.id =
      article.date +
      "-" +
      index +
      "-" +
      simpleHash(article.url);

  }

});


function simpleHash(text){

  let hash=0;

  for(let i=0;i<text.length;i++){

    hash =
      ((hash<<5)-hash)
      +text.charCodeAt(i);

    hash |= 0;

  }

  return Math.abs(hash).toString(36);

}


/* =========================================================
   FAVORITES
========================================================= */

const STORAGE_KEY =
"pressArchiveFavoritesV2";


let favorites;

try{

  favorites =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY)
      ||
      "[]"

let favoritesOnly=false;


/* =========================================================
   OGP CACHE

   同じ記事を毎回Workerへ問い合わせないよう、
   ブラウザに保存します。
========================================================= */

const OGP_CACHE_KEY =
"pressArchiveOGPCacheV1";


let ogpCache;

try{

  ogpCache =
    JSON.parse(
      localStorage.getItem(OGP_CACHE_KEY)
      ||
      "{}"
    );

}catch{

  ogpCache={};

}


/* =========================================================
   OGP取得
========================================================= */

async function getOGP(article){

  /*
    キャッシュがあれば使用
  */

  if(ogpCache[article.url]){

    return ogpCache[article.url];

  }


  try{

    const endpoint =
      OGP_WORKER
      +
      "?url="
      +
      encodeURIComponent(article.url);


    const response =
      await fetch(endpoint);


    if(!response.ok){

      throw new Error(
        "OGP HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error
        ||
        "OGP取得失敗"
      );

    }


    ogpCache[article.url] = data;


    try{

      localStorage.setItem(
        OGP_CACHE_KEY,
        JSON.stringify(ogpCache)
      );

    }catch{

      /*
        キャッシュ容量超過などの場合は
        保存しなくても表示自体は続行
      */

    }


    return data;


  }catch(error){

    console.warn(
      "OGP ERROR:",
      article.url,
      error
    );


    return {

      ok:false,

      title:"",

      siteName:"",

      image:""

    };

  }

}


/* =========================================================
   FAVORITE
========================================================= */

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites =
      favorites.filter(
        item => item !== id
      );

  }else{

    favorites.push(id);

  }


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(favorites)
  );


  render();

}


/* =========================================================
   HELPERS
========================================================= */

function formatDate(date){

  return date.replaceAll("-",".");

}


function escapeHTML(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================================
   CARD
========================================================= */

function createCard(article){

  const card =
    document.createElement("article");


  card.className =
    "article "
    +
    (
      article.type === "MAGAZINE"
      ?
      "magazine"
      :
      "web"
    );


  card.innerHTML = `

    <a
      class="thumb-link"
      href="${escapeHTML(article.url)}"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="thumb">

        <div class="loading">

          <div class="loading-star">
            ✦
          </div>

          <div class="loading-text">
            LOADING
          </div>

        </div>

        <span class="external">
          ↗
        </span>

      </div>

    </a>


    <div class="info">

      <div class="topline">

        <div class="date-type">

          <span class="date">
            ${formatDate(article.date)}
          </span>

          <span class="type">
            ${escapeHTML(article.type)}
          </span>

        </div>


        <button
          class="heart"
          aria-label="お気に入り"
        >

          ${
            favorites.includes(article.id)
            ?
            "♥"
            :
            "♡"
          }

        </button>

      </div>


      <div class="media">
        ${
          escapeHTML(
            article.media
            ||
            "LOADING..."
          )
        }
      </div>


      <div class="title">

        ${
          escapeHTML(
            article.title
            ||
            "記事情報を取得しています..."
          )
        }

      </div>


      <div class="tags">

        ${
          article.tags
          .map(
            tag =>
            `<span class="tag">${escapeHTML(tag)}</span>`
          )
          .join("")
        }

      </div>

    </div>

  `;


  const heart =
    card.querySelector(".heart");


  heart.addEventListener(
    "click",
    ()=>toggleFavorite(article.id)
  );


  /*
    OGPを非同期取得
  */

  loadCardOGP(
    card,
    article
  );


  return card;

}


/* =========================================================
   CARD OGP
========================================================= */

async function loadCardOGP(
  card,
  article
){

  const data =
    await getOGP(article);


  const media =
    card.querySelector(".media");


  const title =
    card.querySelector(".title");


  const thumb =
    card.querySelector(".thumb");


  const loading =
    thumb.querySelector(".loading");


  if(loading){
    loading.remove();
  }


  /* ===============================
     MEDIA

     手動指定を最優先。
  =============================== */

  media.textContent =
    article.media
    ||
    data.siteName
    ||
    new URL(article.url).hostname;


  /* ===============================
     TITLE

     手動指定を最優先。
  =============================== */

  title.textContent =
    article.title
    ||
    data.title
    ||
    "UNTITLED";


  /* ===============================
     IMAGE

     手動画像 → OGP画像
  =============================== */

  const image =
    article.image
    ||
    data.image;


  if(image){

    const img =
      document.createElement("img");


    img.src = image;

    img.alt =
      article.media
      ||
      data.siteName
      ||
      "PRESS ARCHIVE";


    img.loading =
      "lazy";


    img.addEventListener(
      "error",
      ()=>{

        img.remove();

        addFallback(
          thumb,
          article.media
          ||
          data.siteName
          ||
          "PRESS ARCHIVE"
        );

      }
    );


    thumb.prepend(img);


  }else{

    addFallback(
      thumb,
      article.media
      ||
      data.siteName
      ||
      "PRESS ARCHIVE"
    );

  }

}


/* =========================================================
   FALLBACK
========================================================= */

function addFallback(
  thumb,
  media
){

  if(
    thumb.querySelector(".fallback")
  ){
    return;
  }


  const fallback =
    document.createElement("div");


  fallback.className =
    "fallback";


  fallback.innerHTML = `

    <div class="fallback-star">
      ✦
    </div>

    <div class="fallback-media">
      ${escapeHTML(media)}
    </div>

  `;


  thumb.prepend(fallback);

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const grid =
    document.getElementById("grid");


  const empty =
    document.getElementById("empty");


  const meta =
    document.getElementById("meta");


  let list =
    [...articles];


  /* MEMBER */

  if(activeFilter !== "ALL"){

    list =
      list.filter(
        article =>
        article.tags.includes(
          activeFilter
        )
      );

  }


  /* FAVORITES */

  if(favoritesOnly){

    list =
      list.filter(
        article =>
        favorites.includes(
          article.id
        )
      );

  }


  /* SORT */

  const direction =
    document
    .getElementById(
      "sortSelect"
    )
    .value;


  list.sort(
    (a,b)=>{

      const aa =
        new Date(
          a.date
          +
          "T00:00:00"
        );


      const bb =
        new Date(
          b.date
          +
          "T00:00:00"
        );


      return (
        direction === "newest"
        ?
        bb-aa
        :
        aa-bb
      );

    }
  );


  grid.innerHTML="";


  list.forEach(
    article =>{

      grid.appendChild(
        createCard(article)
      );

    }
  );


  meta.textContent =
    String(
      list.length
    )
    .padStart(2,"0")
    +
    " ARCHIVES";


  empty.style.display =
    list.length
    ?
    "none"
    :
    "block";

}


/* =========================================================
   FILTER
========================================================= */

document
.querySelectorAll(".filter")
.forEach(
  button =>{

    button.addEventListener(
      "click",
      ()=>{

        document
        .querySelectorAll(".filter")
        .forEach(
          item =>
          item.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        activeFilter =
          button.dataset.filter;


        favoritesOnly =
          false;


        document
        .getElementById(
          "favoriteFilter"
        )
        .classList.remove(
          "active"
        );


        render();

      }
    );

  }
);


/* =========================================================
   FAVORITES FILTER
========================================================= */

document
.getElementById(
  "favoriteFilter"
)
.addEventListener(
  "click",
  function(){

    favoritesOnly =
      !favoritesOnly;


    this.classList.toggle(
      "active",
      favoritesOnly
    );


    render();

  }
);


/* =========================================================
   SORT
========================================================= */

document
.getElementById(
  "sortSelect"
)
.addEventListener(
  "change",
  render
);


/* =========================================================
   STARS
========================================================= */

const stars =
  document.getElementById(
    "stars"
  );


for(
  let i=0;
  i<80;
  i++
){

  const star =
    document.createElement(
      "span"
    );


  star.className =
    Math.random()>.9
    ?
    "star big"
    :
    "star";


  star.style.left =
    Math.random()*100
    +
    "%";


  star.style.top =
    Math.random()*100
    +
    "%";


  stars.appendChild(
    star
  );

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
